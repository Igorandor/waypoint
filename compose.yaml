name: iris-waypoint
services:
  iris:
    build:
      context: .
      dockerfile: iris/Dockerfile
    command: ['--check-caps', 'false']
    ports:
      - '127.0.0.1:${IRIS_WEB_PORT:-52790}:52773'
    volumes:
      - iris-data:/usr/irissys/mgr
    healthcheck:
      test: ['CMD', 'iris', 'qlist', 'IRIS']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
  portal:
    build: .
    environment:
      IRIS_URL: http://iris:52773
      IRIS_INSTANCE_ID: ${WAYPOINT_INSTANCE_ID:-waypoint-local}
      WAYPOINT_DATA_DIR: /app/data
      HOST: 0.0.0.0
      PORT: 3100
      PUBLIC_ORIGIN: ${WAYPOINT_ORIGIN:-http://localhost:3300}
      COOKIE_SECURE: 'false'
    ports:
      - '127.0.0.1:${WAYPOINT_PORT:-3300}:3100'
    volumes:
      - waypoint-runs:/app/data
    depends_on:
      iris:
        condition: service_healthy
volumes:
  iris-data:
  waypoint-runs:
    name: ${WAYPOINT_RUN_VOLUME:-iris-waypoint_waypoint-runs}
